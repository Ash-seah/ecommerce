name: ecommerce-sandbox

x-api-common: &api-common
  build:
    context: .
    dockerfile: docker/api.Dockerfile
    target: production
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://ecommerce_reader:${ECOMMERCE_READER_PASSWORD}@${POSTGRES_SERVICE_HOST:-postgres}:5432/ecommerce_master
    MIGRATION_DATABASE_URL: postgresql+asyncpg://ecommerce_owner:${ECOMMERCE_OWNER_PASSWORD}@${POSTGRES_SERVICE_HOST:-postgres}:5432/ecommerce_master
    REDIS_URL: redis://${REDIS_SERVICE_HOST:-redis}:6379/1
    MINIO_ENDPOINT: minio:9000
    ROOT_PATH: ${ROOT_PATH:-/api}
  networks:
    - shared
  restart: unless-stopped

services:
  api:
    <<: *api-common
    command:
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --root-path
      - /api
      - --proxy-headers
      - --forwarded-allow-ips=${TRUSTED_PROXY_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${MINIO_MASTER_BUCKET}" &&
        mc mb --ignore-existing "local/$${MINIO_SANDBOX_BUCKET}" &&
        mc ilm import "local/$${MINIO_SANDBOX_BUCKET}" < /config/sandbox-lifecycle.json
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_MASTER_BUCKET: ${MINIO_MASTER_BUCKET}
      MINIO_SANDBOX_BUCKET: ${MINIO_SANDBOX_BUCKET}
    volumes:
      - ./docker/minio-sandbox-lifecycle.json:/config/sandbox-lifecycle.json:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - shared
    restart: "no"

  migrate:
    <<: *api-common
    command: ["alembic", "upgrade", "head"]
    profiles: ["setup"]
    restart: "no"

  seed:
    <<: *api-common
    command: ["python", "-m", "scripts.seed_master_catalog"]
    profiles: ["setup"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  cache-refresh:
    <<: *api-common
    command: ["python", "-m", "scripts.refresh_catalog_cache"]
    profiles: ["setup"]
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"

  test:
    <<: *api-common
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: test
    command: ["pytest"]
    profiles: ["test"]
    restart: "no"

volumes:
  minio-data:

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK_NAME:-terabit-fintech_default}
